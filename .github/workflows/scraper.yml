name: Natura Scraper por Lotes

on:
  workflow_dispatch:
    inputs:
      lote:
        description: 'Número de lote a procesar (1, 2, 3, 4, 5...)'
        required: true
        default: '1'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install selenium pandas beautifulsoup4

    - name: 🤖 Ejecutar Scraper (Lote ${{ github.event.inputs.lote }})
      run: python scraper.py
      env:
        LOTE: ${{ github.event.inputs.lote }}

    - name: 📤 Subir CSV del lote
      if: always()
      run: |
        git config --global user.name "NaturaBot"
        git config --global user.email "bot@natura.net"
        git add productos_lote_*.csv || true
        if git diff --staged --quiet; then
          echo "Sin cambios para guardar"
        else
          git commit -m "📊 Lote ${{ github.event.inputs.lote }} - $(date +'%Y-%m-%d %H:%M:%S')"
          git push
        fi
