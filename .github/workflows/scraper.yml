name: Natura Scraper

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4
    
    - name: 🐍 Configurar Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 📦 Instalar dependencias Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🌐 Instalar Chrome (Oficial)
      uses: browser-actions/setup-chrome@latest
    
    - name: ✅ Verificar Chrome
      run: |
        google-chrome --version
        which google-chrome
    
    - name: 🤖 Ejecutar Scraper
      run: python scraper.py
      timeout-minutes: 30
      env:
        CHROME_BIN: /usr/bin/google-chrome
    
    - name: 📤 Subir CSV
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add productos.csv || echo "Sin cambios"
        git diff-index --quiet HEAD || git commit -m "📊 Actualización - $(date +'%Y-%m-%d %H:%M:%S')"
        git push || echo "Sin cambios para push"
    
    - name: ✅ Éxito
      if: success()
      run: |
        echo "✅ Scraper completado correctamente"
    
    - name: ❌ Error
      if: failure()
      run: |
        echo "❌ Error en la ejecución"
