name: Natura Scraper

on:
  # Ejecutar automáticamente cada día a las 2 AM UTC
  schedule:
    - cron: '0 2 * * *'
  
  # Permitir ejecución manual desde GitHub
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Clonar repositorio
      uses: actions/checkout@v4
    
    - name: 🐍 Configurar Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🌐 Instalar Chrome y ChromeDriver
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser chromium-chromedriver
        echo "CHROMEDRIVER_PATH=/usr/bin/chromedriver" >> $GITHUB_ENV
        echo "CHROME_BIN=/usr/bin/chromium-browser" >> $GITHUB_ENV
    
    - name: 🤖 Ejecutar Scraper
      run: |
        python scraper.py
      timeout-minutes: 30
    
    - name: 📤 Subir CSV actualizado
      if: success()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add productos.csv
        git diff-index --quiet HEAD || git commit -m "📊 Actualización automática de productos - $(date +'%Y-%m-%d %H:%M:%S')"
        git push
    
    - name: 📨 Notificar éxito
      if: success()
      run: |
        echo "✅ Scraper ejecutado correctamente"
        echo "📦 Productos extraídos y guardados en CSV"
    
    - name: ⚠️ Notificar error
      if: failure()
      run: |
        echo "❌ Error en la ejecución del scraper"
        echo "Revisa los logs en GitHub Actions"
